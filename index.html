<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TGB - Televisão da Guiné-Bissau | Ao Vivo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --tgb-red: #E31B23;
      --tgb-yellow: #FECB00;
      --tgb-green: #008751;
      --tgb-dark: #121212;
      --tgb-light: #F4F4F9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--tgb-light);
      color: #333;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .top-bar {
      background-color: var(--tgb-dark);
      color: white;
      padding: 8px 0;
      font-size: 14px;
    }

    .top-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .live-badge {
      color: var(--tgb-red);
      font-weight: bold;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      background: white;
    }

    .logo-box {
      font-size: 32px;
      font-weight: 900;
      position: relative;
      display: inline-block;
    }

    .red { color: var(--tgb-red); }
    .yellow { color: var(--tgb-yellow); }
    .green { color: var(--tgb-green); }

    .star-icon {
      font-size: 14px;
      color: #000;
      position: absolute;
      top: 5px;
      left: 22px;
    }

    .logo-text {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 600;
      transition: 0.3s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--tgb-red);
    }

    .hero-stream {
      margin: 30px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .player-container {
      background: black;
      width: 100%;
      height: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .stream-info {
      padding: 25px;
    }

    .share-buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary { background: var(--tgb-red); color: white; }
